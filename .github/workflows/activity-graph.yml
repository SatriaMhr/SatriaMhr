name: Generate GitHub Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-activity-graph
    steps:
      - uses: actions/checkout@v3
      - uses: ashutosh00710/github-readme-activity-graph@v2.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: dist/github-contribution-grid-snake.svg
          theme: tokyo-night
          area: true
          bg_color: "0f172a"
          color: "00ff66"
          line: "00ff66"
          point: "ffffff"