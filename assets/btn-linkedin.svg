<svg xmlns="http://www.w3.org/2000/svg" width="190" height="54" viewBox="0 0 190 54" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<defs><clipPath id="p"><rect x="1" y="1" width="188" height="52" rx="26"/></clipPath></defs>
<style>
.sh{animation:sw 5s ease-in-out 1.2s infinite}
.rg{transform-box:fill-box;transform-origin:center;animation:rg 2.8s ease-out 1.2s infinite}
@keyframes sw{0%{transform:translateX(-90px) skewX(-20deg)}40%,100%{transform:translateX(260px) skewX(-20deg)}}
@keyframes rg{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<rect x="1" y="1" width="188" height="52" rx="26" fill="#221f1c" stroke="#3b3631" stroke-width="1.5"/>
<g clip-path="url(#p)"><rect class="sh" x="0" y="0" width="36" height="54" fill="#ffffff" fill-opacity=".05"/></g>
<circle class="rg" cx="34" cy="27" r="4.5" fill="#8ea6bd"/><circle cx="34" cy="27" r="4.5" fill="#8ea6bd"/>
<text x="102" y="32" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#ece6da">LinkedIn</text>
</svg>